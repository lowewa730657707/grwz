<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BIRTHDAY.SYS // LEVEL 21</title>
<style>
  :root{
    --bg:#04060e;
    --cyan:#00e5ff;
    --blue:#3d6bff;
    --ice:#9fe8ff;
    --amber:#ffb020;
    --txt:#dbe9ff;
    --dim:#6d84a8;
    --line:rgba(0,229,255,.16);
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Cascadia Mono","Courier New",monospace;
    --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    font-family:var(--sans);
    background:radial-gradient(130% 90% at 50% -10%, #0d2340 0%, #060b18 46%, #04060e 100%);
    color:var(--txt);
    overflow:hidden; user-select:none; -webkit-user-select:none;
  }

  /* ---------- 背景层 ---------- */
  .grid-floor{
    position:fixed; left:-60%; right:-60%; bottom:-6vh; height:74vh; z-index:0;
    background-image:
      linear-gradient(rgba(0,229,255,.13) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,.08) 1px, transparent 1px);
    background-size:72px 72px, 72px 72px;
    transform:perspective(420px) rotateX(74deg);
    transform-origin:50% 100%;
    -webkit-mask-image:linear-gradient(to top, #000 0%, rgba(0,0,0,.28) 42%, transparent 74%);
    mask-image:linear-gradient(to top, #000 0%, rgba(0,0,0,.28) 42%, transparent 74%);
    animation:gridmove 7s linear infinite; opacity:.3; pointer-events:none;
  }
  @keyframes gridmove{ from{ background-position:0 0, 0 0; } to{ background-position:0 72px, 0 0; } }
  .scan{
    position:fixed; inset:0; z-index:70; pointer-events:none; opacity:.22;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.045) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  .vignette{
    position:fixed; inset:0; z-index:69; pointer-events:none;
    background:radial-gradient(120% 85% at 50% 45%, transparent 46%, rgba(0,0,0,.74) 100%);
  }
  #fx{ position:fixed; inset:0; width:100%; height:100%; z-index:50; pointer-events:none; }

  #flash{
    position:fixed; inset:0; z-index:90; pointer-events:none;
    background:radial-gradient(circle at 50% 50%, #ffffff, #9fe8ff 40%, rgba(0,229,255,0) 72%);
    opacity:0; transition:opacity .55s ease-out;
  }
  #flash.on{ opacity:1; transition:none; }

  /* ---------- HUD ---------- */
  .hud{
    position:fixed; z-index:100; font-family:var(--mono); font-size:11px;
    letter-spacing:.18em; color:var(--dim); text-transform:uppercase; pointer-events:none;
  }
  .hud.tl{ top:max(14px, env(safe-area-inset-top)); left:16px; }
  .hud.bl{ bottom:max(14px, env(safe-area-inset-bottom)); left:16px; }
  .hud.br{ bottom:max(14px, env(safe-area-inset-bottom)); right:16px; }
  .hud b{ color:var(--cyan); font-weight:500; }
  .dot-live{
    display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--cyan);
    margin-right:7px; vertical-align:middle; box-shadow:0 0 8px var(--cyan);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }

  #musicBtn{
    position:fixed; top:max(12px, env(safe-area-inset-top)); right:14px; z-index:100;
    width:42px; height:42px; cursor:pointer; color:var(--cyan);
    background:rgba(0,229,255,.06); border:1px solid var(--line);
    display:grid; place-items:center; font-size:16px; font-family:var(--mono);
    clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
    transition:.22s ease;
  }
  #musicBtn:hover{ background:rgba(0,229,255,.16); box-shadow:0 0 22px rgba(0,229,255,.32); }
  #musicBtn.on{ border-color:var(--cyan); box-shadow:0 0 20px rgba(0,229,255,.35); }

  /* ---------- 通用面板 / 按钮 ---------- */
  .panel{
    position:relative; background:linear-gradient(180deg, rgba(12,28,54,.78), rgba(4,9,20,.82));
    border:1px solid var(--line); backdrop-filter:blur(7px);
    clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
    box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
  }
  .btn{
    font-family:var(--mono); font-size:12px; letter-spacing:.2em; text-transform:uppercase;
    padding:14px 26px; cursor:pointer; color:var(--cyan);
    background:rgba(0,229,255,.07); border:1px solid rgba(0,229,255,.45);
    clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px);
    transition:.22s ease;
  }
  .btn:hover{ background:rgba(0,229,255,.18); box-shadow:0 0 26px rgba(0,229,255,.35); color:#fff; }
  .btn:active{ transform:translateY(1px); }
  .btn.ghost{ color:var(--dim); border-color:rgba(255,255,255,.16); background:rgba(255,255,255,.03); }
  .btn.ghost:hover{ color:var(--txt); border-color:rgba(255,255,255,.4); box-shadow:none; background:rgba(255,255,255,.07); }

  /* ---------- 屏幕 ---------- */
  .screen{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(12px,2.4vh,24px);
    padding:max(64px, env(safe-area-inset-top)) 20px max(58px, env(safe-area-inset-bottom));
    text-align:center; overflow-y:auto;
    opacity:0; transform:translateY(14px); pointer-events:none;
    transition:opacity .6s ease, transform .6s cubic-bezier(.22,1,.36,1);
  }
  .screen.active{ opacity:1; transform:none; pointer-events:auto; }

  /* ---------- ① 启动 ---------- */
  #bootPanel{ width:min(660px,92vw); padding:26px 24px 22px; text-align:left; }
  #bootPanel .bar{
    display:flex; align-items:center; gap:8px; font-family:var(--mono); font-size:10px;
    letter-spacing:.2em; color:var(--dim); padding-bottom:12px; margin-bottom:16px;
    border-bottom:1px solid rgba(0,229,255,.12); text-transform:uppercase;
  }
  .bar i{ width:8px; height:8px; border-radius:50%; background:#1d3a5c; display:inline-block; }
  .bar i:first-child{ background:var(--cyan); box-shadow:0 0 8px var(--cyan); }
  .bar span{ margin-left:auto; }
  #bootLines{ font-family:var(--mono); font-size:clamp(11.5px,1.6vh,14px); line-height:2.05; min-height:10.3em; }
  #bootLines .line{ color:var(--ice); opacity:0; animation:fadeIn .25s ease forwards; }
  @keyframes fadeIn{ to{ opacity:1; } }
  #bootLines .prompt{ color:var(--cyan); }
  #bootLines .caret{
    display:inline-block; width:7px; height:1em; background:var(--cyan);
    vertical-align:-2px; margin-left:2px; animation:blink .8s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  .boot-foot{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    margin-top:16px; padding-top:16px; border-top:1px solid rgba(0,229,255,.12);
  }
  .boot-foot .tip{ font-family:var(--mono); font-size:10px; letter-spacing:.16em; color:var(--dim); }
  #startBtn{ opacity:0; pointer-events:none; transition:opacity .45s ease; }
  #startBtn.show{ opacity:1; pointer-events:auto; animation:btnGlow 2.4s ease-in-out infinite; }
  @keyframes btnGlow{ 0%,100%{ box-shadow:0 0 0 rgba(0,229,255,0); } 50%{ box-shadow:0 0 30px rgba(0,229,255,.4); } }

  /* ---------- ② 蓄能 ---------- */
  .kicker{
    font-family:var(--mono); font-size:11px; letter-spacing:.32em; color:var(--dim);
    text-transform:uppercase; margin:0;
  }
  .title{
    margin:0; font-weight:800; letter-spacing:.04em;
    font-size:clamp(26px,5.4vh,46px); line-height:1.25;
    background:linear-gradient(100deg,#ffffff 0%,#9fe8ff 38%,#00e5ff 62%,#3d6bff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 30px rgba(0,229,255,.32));
  }
  .sub{ margin:0; font-family:var(--mono); font-size:clamp(11px,1.5vh,13px); letter-spacing:.24em; color:var(--dim); text-transform:uppercase; }

  #reactorWrap{
    position:relative; width:min(280px,74vw); aspect-ratio:1/1; touch-action:none;
    cursor:pointer; display:grid; place-items:center; margin:2px 0;
    --p:0;
  }
  #reactorWrap::before{
    content:""; position:absolute; inset:6%; border-radius:50%;
    background:radial-gradient(circle, rgba(0,229,255,calc(.04 + var(--p) * .3)) 0%, transparent 68%);
  }
  #ticks{ position:absolute; inset:0; }
  .tick{
    position:absolute; left:50%; top:50%; width:3px; height:15px; margin:-7.5px 0 0 -1.5px;
    background:rgba(0,229,255,.16); border-radius:2px; transition:background .18s ease, box-shadow .18s ease;
  }
  .tick.on{ background:var(--cyan); box-shadow:0 0 10px 2px rgba(0,229,255,.85); }
  #reactorWrap.done .tick{ background:#bffaff; box-shadow:0 0 14px 3px rgba(160,240,255,.9); }
  #ring{ position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  #ringBg{ fill:none; stroke:rgba(0,229,255,.10); stroke-width:2; }
  #ringProg{ fill:none; stroke:var(--cyan); stroke-width:2.5; stroke-linecap:round;
    filter:drop-shadow(0 0 6px rgba(0,229,255,.9)); }
  #core{
    position:relative; width:47%; aspect-ratio:1/1; border-radius:50%;
    background:radial-gradient(circle at 50% 42%, #0b1c33 0%, #050a16 72%);
    border:1px solid rgba(0,229,255,calc(.2 + var(--p) * .6));
    display:grid; place-items:center; place-content:center;
    box-shadow:0 0 calc(10px + var(--p) * 42px) rgba(0,229,255,calc(.1 + var(--p) * .55)), inset 0 0 30px rgba(0,229,255,.12);
  }
  #coreNum{
    font-family:var(--mono); font-size:clamp(30px,7.4vh,46px); font-weight:700; line-height:1;
    color:#fff; text-shadow:0 0 calc(6px + var(--p) * 26px) rgba(0,229,255,.9);
    font-variant-numeric:tabular-nums;
  }
  #coreLabel{ font-family:var(--mono); font-size:10px; letter-spacing:.3em; color:var(--dim); margin-top:6px; }
  #reactorWrap.charging #core{ animation:coreBeat .9s ease-in-out infinite; }
  @keyframes coreBeat{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); } }
  #reactorWrap.done #core{ border-color:#bffaff; box-shadow:0 0 70px rgba(0,229,255,.85), inset 0 0 40px rgba(160,240,255,.35); }
  .charge-bar{ width:min(280px,74vw); height:3px; background:rgba(0,229,255,.12); overflow:hidden; }
  .charge-bar i{ display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--blue),var(--cyan),#fff);
    box-shadow:0 0 14px rgba(0,229,255,.9); }

  /* ---------- ③ 祝福卡片 ---------- */
  #wishScreen{ justify-content:center; gap:clamp(14px,2.6vh,26px); }
  .card{
    position:relative; width:min(540px,92vw); padding:26px 26px 16px; text-align:left;
    background:linear-gradient(165deg, rgba(13,31,60,.93), rgba(4,9,20,.96));
    border:1px solid rgba(0,229,255,.22);
    clip-path:polygon(20px 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%,0 20px);
    box-shadow:0 30px 70px rgba(0,0,0,.66), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(8px);
  }
  .card::after{
    content:""; position:absolute; left:0; right:0; top:0; height:2px;
    background:linear-gradient(90deg,transparent,var(--cyan) 25%,#ffffff 50%,var(--cyan) 75%,transparent);
    opacity:.85;
  }
  .card.in{ animation:cardIn .95s cubic-bezier(.22,1,.36,1) both; }
  @keyframes cardIn{
    from{ opacity:0; transform:translateY(26px) scale(.93) rotate(-.6deg); }
    to{ opacity:1; transform:none; }
  }
  .card-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
  .card-code{ font-family:var(--mono); font-size:10.5px; letter-spacing:.24em; color:var(--cyan); text-transform:uppercase; }
  .card-dots{ display:flex; gap:6px; }
  .card-dots i{ width:6px; height:6px; border-radius:50%; background:rgba(0,229,255,.2); transition:.3s ease; }
  .card-dots i.on{ background:var(--cyan); box-shadow:0 0 10px rgba(0,229,255,.9); }
  .card-body{ min-height:172px; }
  .card-body.swap{ animation:pageIn .44s cubic-bezier(.22,1,.36,1) both; }
  @keyframes pageIn{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
  .card-title{
    margin:0 0 14px; font-size:clamp(19px,2.95vh,26px); font-weight:800; letter-spacing:.03em;
    background:linear-gradient(100deg,#ffffff,#bfeaff 55%,#00e5ff);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .card-text{ margin:0; font-size:clamp(13.5px,1.95vh,16px); line-height:2.05; color:#c3d8f2; letter-spacing:.03em; }
  .card-text .caret{ display:inline-block; width:7px; height:1em; background:var(--cyan); vertical-align:-2px; animation:blink .8s steps(1) infinite; }
  .card-foot{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-top:18px; padding-top:13px; border-top:1px solid rgba(0,229,255,.12);
  }
  .card-sign{ font-family:var(--mono); font-size:10px; letter-spacing:.2em; color:var(--dim); text-transform:uppercase; }
  .card-nav{
    width:34px; height:34px; cursor:pointer; color:var(--cyan); font-size:18px; line-height:1; font-family:var(--mono);
    background:rgba(0,229,255,.07); border:1px solid rgba(0,229,255,.32);
    display:grid; place-items:center;
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    transition:.2s ease;
  }
  .card-nav:hover{ background:rgba(0,229,255,.2); box-shadow:0 0 20px rgba(0,229,255,.3); }
  .card-nav:disabled{ opacity:.28; cursor:default; box-shadow:none; background:rgba(255,255,255,.03); color:var(--dim); border-color:rgba(255,255,255,.12); }

  .actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

  .float-txt{
    position:fixed; z-index:45; pointer-events:none; font-family:var(--mono); font-size:12px;
    letter-spacing:.1em; color:var(--ice); text-shadow:0 0 14px rgba(0,229,255,.9); white-space:nowrap;
    animation:floatUp 1.35s ease-out forwards;
  }
  @keyframes floatUp{ from{ transform:translate(-50%,0); opacity:1; } to{ transform:translate(-50%,-72px); opacity:0; } }

  /* ---------- 弹幕祝福 ---------- */
  #dmLayer{ position:fixed; inset:0; z-index:30; overflow:hidden; pointer-events:none; }
  .dm{
    position:absolute; left:100vw; top:0; white-space:nowrap;
    pointer-events:auto; cursor:pointer;
    font-size:14px; font-weight:500; letter-spacing:.02em; color:#d9f3ff;
    text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 10px rgba(0,0,0,.9), 0 0 20px rgba(0,229,255,.35);
    will-change:transform; transition:filter .18s ease;
  }
  .dm.run{ animation-name:dmMove; animation-timing-function:linear; animation-fill-mode:forwards; }
  @keyframes dmMove{
    from{ transform:translate3d(0,0,0); }
    to{ transform:translate3d(var(--x1,-140vw),0,0); }
  }
  .dm .sender{ font-family:var(--mono); font-size:11px; color:#6fd6ff; margin-right:6px; opacity:.9; }
  .dm.me{
    color:#fff; font-weight:700; padding:4px 13px; border-radius:999px;
    background:rgba(255,176,32,.16); border:1px solid rgba(255,176,32,.55);
    text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 18px rgba(255,176,32,.8);
  }
  .dm.me .sender{ color:var(--amber); opacity:1; }
  .dm.pop{ filter:brightness(1.9) saturate(1.5); }

  #dmBar{
    position:fixed; left:0; right:0; bottom:0; z-index:110;
    display:none; align-items:center; gap:10px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(4,9,20,0) 0%, rgba(4,9,20,.86) 42%, rgba(4,9,20,.96) 100%);
    transform:translateY(20px); opacity:0; transition:transform .4s ease, opacity .4s ease;
  }
  #dmBar.show{ display:flex; transform:none; opacity:1; }
  #dmInput{
    flex:1; min-width:0; font-family:var(--sans); font-size:13px; color:var(--txt);
    background:rgba(0,229,255,.06); border:1px solid var(--line);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    padding:11px 14px; outline:none; transition:.22s ease;
  }
  #dmInput::placeholder{ color:#5d7796; }
  #dmInput:focus{ border-color:rgba(0,229,255,.6); background:rgba(0,229,255,.1); box-shadow:0 0 22px rgba(0,229,255,.2); }
  #dmSend{ padding:11px 20px; }
  #dmToggle{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; cursor:pointer;
    padding:11px 12px; color:var(--cyan); background:rgba(0,229,255,.07);
    border:1px solid rgba(0,229,255,.35); white-space:nowrap;
    clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
    transition:.22s ease;
  }
  #dmToggle:hover{ background:rgba(0,229,255,.16); }
  #dmToggle.off{ color:var(--dim); border-color:rgba(255,255,255,.16); background:rgba(255,255,255,.03); }
  body.dm-on #wishScreen{ padding-bottom:max(134px, calc(120px + env(safe-area-inset-bottom))); }
  @media (max-width:420px){
    .dm{ font-size:12.5px; }
    .dm .sender{ font-size:10px; }
    #dmBar{ padding:10px 12px calc(10px + env(safe-area-inset-bottom)); gap:8px; }
    #dmInput{ font-size:12.5px; padding:10px 12px; }
    #dmSend{ padding:10px 14px; }
    #dmToggle{ padding:10px 9px; font-size:10px; }
  }

  .shake{ animation:shake .42s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake{
    10%,90%{ transform:translate3d(-2px,0,0); }
    20%,80%{ transform:translate3d(4px,0,0); }
    30%,50%,70%{ transform:translate3d(-7px,0,0); }
    40%,60%{ transform:translate3d(7px,0,0); }
  }

  @media (max-height:720px){
    #reactorWrap{ width:min(226px,64vw); }
    .card-body{ min-height:150px; }
    #bootLines{ min-height:9.4em; }
  }
  @media (prefers-reduced-motion:reduce){
    .grid-floor,.dot-live,.tick{ animation:none !important; }
    .screen{ transition:none; }
  }
</style>
</head>
<body>

<div class="grid-floor"></div>
<div class="vignette"></div>
<canvas id="fx"></canvas>
<div class="scan"></div>
<div id="flash"></div>
<div id="dmLayer"></div>

<div class="hud tl"><span class="dot-live"></span>BIRTHDAY.SYS <b>v2.0</b></div>
<button id="musicBtn" class="on" title="音乐开关">&#9834;</button>

<!-- ① 启动 -->
<section class="screen active" id="bootScreen">
  <div class="panel" id="bootPanel">
    <div class="bar"><i></i><i></i><i></i><span>SYS/BOOT</span></div>
    <div id="bootLines"></div>
    <div class="boot-foot">
      <span class="tip" id="bootTip">点击任意处可跳过</span>
      <button class="btn" id="startBtn">&gt; 授权启动 · START</button>
    </div>
  </div>
</section>

<!-- ② 蓄能 -->
<section class="screen" id="chargeScreen">
  <p class="kicker">Step 01 / Charge</p>
  <h1 class="title" id="chargeTitle">为 21 岁蓄能</h1>
  <div id="reactorWrap">
    <svg id="ring" viewBox="0 0 280 280" aria-hidden="true">
      <circle id="ringBg" cx="140" cy="140" r="118"></circle>
      <circle id="ringProg" cx="140" cy="140" r="118"></circle>
    </svg>
    <div id="ticks"></div>
    <div id="core">
      <span id="coreNum">0</span>
      <span id="coreLabel">YEARS</span>
    </div>
  </div>
  <div class="charge-bar"><i id="chargeBar"></i></div>
  <p class="sub" id="chargeHint">长按核心开始蓄能 · 松开会中断</p>
</section>

<!-- ③ 祝福卡片 -->
<section class="screen" id="wishScreen">
  <div class="card" id="card">
    <div class="card-head">
      <span class="card-code" id="cardCode">01 / BIRTHDAY</span>
      <span class="card-dots" id="cardDots"></span>
    </div>
    <div class="card-body" id="cardBody">
      <h1 class="card-title" id="cardTitle"></h1>
      <p class="card-text" id="cardText"></p>
    </div>
    <div class="card-foot">
      <button class="card-nav" id="cardPrev" aria-label="上一页">&#8249;</button>
      <span class="card-sign" id="cardSign">FOR YOU · 21</span>
      <button class="card-nav" id="cardNext" aria-label="下一页">&#8250;</button>
    </div>
  </div>
  <div class="actions">
    <button class="btn" id="replayBtn">&#9834; 再听一遍</button>
    <button class="btn ghost" id="againBtn">&#8635; 重新蓄能</button>
  </div>
</section>

<!-- 弹幕发送栏 -->
<div id="dmBar">

<script>
(function () {
  'use strict';

  /* ==================== 可自定义 ==================== */
  var CONFIG = {
    // 名字：也可以网址参数覆盖  xxx.html?name=阿伟
    name: (new URLSearchParams(location.search).get('name') || '何成扬').slice(0, 14),
    // 卡片大标题模板，{name} 会替换成上面的名字
    titleTemplate: '祝贺“{name}”生日快乐',
    age: 21,
    // 填出生日期可显示精确的"运行天数"，例如 '2005-03-18'；不填则按年龄估算
    birthDate: null,
    message: [
      '21 岁，是刚刚好的年纪。',
      '有野心，也有底气；有想去的地方，也有敢出发的勇气。',
      '愿你以后的每一年，都比上一年更自由。'
    ],
    // 卡片后面几页（点右下角箭头 / 左右滑动翻页）
    cards: [
      { name: '好运', title: '好运 · 持续在线',
        text: '愿你接下来这一年——想做的事都有回响，投出去的简历、发出去的消息，都有人认真回复。' },
      { name: '底气', title: '底气 · 稳步上涨',
        text: '21 岁最好的东西不是年轻，是敢。愿你敢拒绝、敢开始、敢重来，也敢承认自己还没想清楚。' },
      { name: '自由', title: '自由 · 权限已开',
        text: '愿你赚得比花得多，睡得比想得早；想去哪就去哪，身边永远有几个喊一声就到的人。' }
    ]
  };
  /* ======================================================== */

  var $ = function (s) { return document.querySelector(s); };
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };

  /* ==================== 音频引擎（代码合成，无需联网） ==================== */
  var Snd = (function () {
    var ac = null, musicBus = null, sfxBus = null, lp = null;
    var active = [], loopTimer = null, musicOn = true;
    var beat = 0.5; // 120 BPM
    var BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
    var riserOsc = null, riserGain = null, riserFilter = null;

    function ensure() {
      if (ac) return ac;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ac = new AC(); } catch (e) { ac = null; return null; }
      if (!ac) return null;
      lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
      musicBus = ac.createGain(); musicBus.gain.value = 0.85;
      sfxBus = ac.createGain(); sfxBus.gain.value = 0.55;
      musicBus.connect(lp); lp.connect(ac.destination);
      sfxBus.connect(ac.destination);
      return ac;
    }
    function unlock() { var c = ensure(); if (c && c.state === 'suspended') c.resume(); }
    function freq(n) {
      var m = /^([A-G])(#?)(\d)$/.exec(n);
      if (!m) return 440;
      var semi = BASE[m[1]] + (m[2] ? 1 : 0) + (parseInt(m[3], 10) + 1) * 12;
      return 440 * Math.pow(2, (semi - 69) / 12);
    }
    function osc(f, t, dur, o) {
      o = o || {};
      if (!ac) return null;
      var o1 = ac.createOscillator();
      o1.type = o.type || 'triangle'; o1.frequency.value = f;
      if (o.detune) o1.detune.value = o.detune;
      var g = ac.createGain();
      var peak = o.gain == null ? 0.2 : o.gain;
      var atk = o.attack == null ? 0.012 : o.attack;
      var rel = o.release == null ? 0.14 : o.release;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t + atk);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * 0.65), t + Math.max(atk + 0.01, dur * 0.82));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur + rel);
      if (o.filter) {
        var f1 = ac.createBiquadFilter();
        f1.type = o.filter; f1.frequency.value = o.cut || 2200;
        if (o.q) f1.Q.value = o.q;
        o1.connect(f1); f1.connect(g);
      } else { o1.connect(g); }
      g.connect(o.bus || musicBus);
      o1.start(t); o1.stop(t + dur + rel + 0.03);
      active.push(o1);
      o1.onended = function () { try { o1.disconnect(); g.disconnect(); } catch (e) {} };
      return o1;
    }
    function noise(t, dur, gain, o) {
      o = o || {};
      if (!ac) return null;
      var len = Math.max(1, Math.floor(ac.sampleRate * dur));
      var buf = ac.createBuffer(1, len, ac.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = ac.createBufferSource(); src.buffer = buf;
      var f = ac.createBiquadFilter();
      f.type = o.type || 'bandpass'; f.frequency.value = o.cut || 900; f.Q.value = o.q == null ? 1 : o.q;
      var g = ac.createGain();
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(o.bus || sfxBus);
      src.start(t); src.stop(t + dur + 0.02);
      active.push(src);
      src.onended = function () { try { src.disconnect(); g.disconnect(); } catch (e) {} };
      return src;
    }
    function kick(t) {
      var o1 = ac.createOscillator(); o1.type = 'sine';
      o1.frequency.setValueAtTime(158, t);
      o1.frequency.exponentialRampToValueAtTime(44, t + 0.13);
      var g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.5, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.27);
      o1.connect(g); g.connect(musicBus);
      o1.start(t); o1.stop(t + 0.3);
      active.push(o1);
    }
    function hat(t) { noise(t, 0.035, 0.05, { type: 'highpass', cut: 7600, bus: musicBus }); }

    // 《生日快乐》旋律（每段 6 拍）
    var MELODY = [
      ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 1],
      ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 1],
      ['G4', .75], ['G4', .25], ['G5', 1], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 1],
      ['F5', .75], ['F5', .25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 1.6]
    ];
    var CHORDS = [
      ['C3', 'E3', 'G3'], ['G3', 'B3', 'D4'], ['G3', 'B3', 'D4'],
      ['C3', 'E3', 'G3'], ['F3', 'A3', 'C4'], ['C3', 'E3', 'G3']
    ];
    var ROOTS = ['C2', 'G2', 'G2', 'C2', 'F2', 'C2'];

    function build() {
      unlock(); if (!ac) return 0;
      var t0 = ac.currentTime + 0.12, i, t;
      for (i = 0; i < CHORDS.length; i++) {
        (function (m, tt) {
          m.forEach(function (nn) {
            osc(freq(nn), tt, 3 * beat * 0.95, { type: 'sine', gain: 0.048, attack: 0.3, release: 0.6 });
          });
        })(CHORDS[i], t0 + i * 3 * beat);
      }
      for (i = 0; i < 18; i++) {
        t = t0 + i * beat;
        kick(t);
        hat(t + beat * 0.5);
        osc(freq(ROOTS[Math.floor(i / 3)]), t, beat * 0.4,
          { type: 'sawtooth', gain: 0.085, filter: 'lowpass', cut: 460, release: 0.07 });
      }
      t = t0;
      for (i = 0; i < MELODY.length; i++) {
        var n = MELODY[i], dur = n[1] * beat * 0.92;
        osc(freq(n[0]), t, dur, { type: 'triangle', gain: 0.155 });
        osc(freq(n[0]), t, dur, { type: 'square', gain: 0.03, filter: 'lowpass', cut: 2400 });
        osc(freq(n[0]) * 2, t, dur * 0.6, { type: 'sine', gain: 0.035, release: 0.2 });
        t += n[1] * beat;
      }
      return (t - t0) + 0.9;
    }
    function stop() {
      if (loopTimer) { clearTimeout(loopTimer); loopTimer = null; }
      if (!ac) return;
      var now = ac.currentTime;
      active.forEach(function (o) { try { o.stop(now + 0.1); } catch (e) {} });
      active = [];
      musicBus.gain.cancelScheduledValues(now);
      musicBus.gain.setValueAtTime(musicBus.gain.value, now);
      musicBus.gain.linearRampToValueAtTime(0.0001, now + 0.14);
    }
    function play() {
      if (!musicOn) return;
      stop();
      if (!ac) ensure();
      if (!ac) return;
      musicBus.gain.cancelScheduledValues(ac.currentTime);
      musicBus.gain.setValueAtTime(0.85, ac.currentTime);
      var dur = build();
      if (!dur) return;
      loopTimer = setTimeout(function () { if (musicOn) play(); }, (dur + 2.4) * 1000);
    }
    function setOn(v) { musicOn = v; if (v) play(); else stop(); }

    function blip(p) {
      unlock(); if (!ac) return;
      osc(520 + p * 900, ac.currentTime, 0.055,
        { type: 'square', gain: 0.05, bus: sfxBus, release: 0.05, filter: 'lowpass', cut: 3600 });
    }
    function soft() {
      unlock(); if (!ac) return;
      var t = ac.currentTime;
      osc(880, t, 0.16, { type: 'sine', gain: 0.09, bus: sfxBus, release: 0.3 });
      osc(1320, t + 0.06, 0.2, { type: 'sine', gain: 0.06, bus: sfxBus, release: 0.35 });
    }
    function confirm() {
      unlock(); if (!ac) return;
      var t = ac.currentTime;
      [880, 1108.7, 1318.5, 1760].forEach(function (f, i) {
        osc(f, t + i * 0.075, 0.5, { type: 'triangle', gain: 0.11, bus: sfxBus, release: 0.6 });
      });
      noise(t, 0.5, 0.16, { type: 'highpass', cut: 3000 });
    }
    function pop() {
      unlock(); if (!ac) return;
      var t = ac.currentTime;
      noise(t, 0.07, 0.3, { cut: 1800, bus: sfxBus });
      osc(900, t, 0.05, { type: 'square', gain: 0.09, bus: sfxBus, release: 0.05 });
    }

    function riserStart() {
      unlock(); if (!ac) return;
      riserStop(true);
      riserOsc = ac.createOscillator(); riserOsc.type = 'sawtooth'; riserOsc.frequency.value = 110;
      riserFilter = ac.createBiquadFilter(); riserFilter.type = 'lowpass';
      riserFilter.frequency.value = 700; riserFilter.Q.value = 5;
      riserGain = ac.createGain(); riserGain.gain.value = 0.0001;
      riserOsc.connect(riserFilter); riserFilter.connect(riserGain); riserGain.connect(sfxBus);
      riserOsc.start();
    }
    function riserSet(p) {
      if (!ac || !riserOsc) return;
      var t = ac.currentTime;
      riserOsc.frequency.setTargetAtTime(110 + p * 800, t, 0.06);
      riserFilter.frequency.setTargetAtTime(600 + p * 2600, t, 0.06);
      riserGain.gain.setTargetAtTime(0.012 + p * 0.05, t, 0.06);
    }
    function riserStop(immediate) {
      if (!ac || !riserOsc) return;
      var o = riserOsc, g = riserGain, t = ac.currentTime;
      riserOsc = null; riserGain = null; riserFilter = null;
      try {
        g.gain.setTargetAtTime(0.0001, t, immediate ? 0.01 : 0.05);
        o.stop(t + (immediate ? 0.06 : 0.35));
      } catch (e) {}
    }
    return { unlock: unlock, play: play, stop: stop, setOn: setOn,
             blip: blip, soft: soft, confirm: confirm, pop: pop,
             riserStart: riserStart, riserSet: riserSet, riserStop: riserStop,
             isOn: function () { return musicOn; } };
  })();

  /* ==================== 粒子 / 星空 ==================== */
  var FX = (function () {
    var cv = $('#fx'), g = cv.getContext('2d');
    var W = 0, H = 0, DPR = 1, parts = [], dust = [], raf = null, last = 0;
    var COLORS = ['#00e5ff', '#7cd8ff', '#3d6bff', '#ffffff', '#9fe8ff', '#ffb020'];

    function resize() {
      DPR = Math.min(2, window.devicePixelRatio || 1);
      W = cv.clientWidth || window.innerWidth;
      H = cv.clientHeight || window.innerHeight;
      cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
      g.setTransform(DPR, 0, 0, DPR, 0, 0);
      makeDust();
    }
    function makeDust() {
      dust = [];
      if (reduced) return;
      var n = Math.min(70, Math.round(W / 16));
      for (var i = 0; i < n; i++) {
        dust.push({
          x: Math.random() * W, y: Math.random() * H,
          r: 0.6 + Math.random() * 1.5,
          vy: -(4 + Math.random() * 14), vx: (Math.random() - 0.5) * 8,
          a: 0.15 + Math.random() * 0.5, ph: Math.random() * Math.PI * 2,
          col: Math.random() < 0.12 ? '#ffb020' : '#7cd8ff'
        });
      }
    }
    function add(p) { parts.push(p); start(); }
    function start() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
    function frame(now) {
      var dt = Math.min(0.05, (now - last) / 1000); last = now;
      g.clearRect(0, 0, W, H);
      for (var d = 0; d < dust.length; d++) {
        var m = dust[d];
        m.y += m.vy * dt; m.x += m.vx * dt; m.ph += dt * 2;
        if (m.y < -6) { m.y = H + 6; m.x = Math.random() * W; }
        if (m.x < -6) m.x = W + 6; else if (m.x > W + 6) m.x = -6;
        g.globalAlpha = m.a * (0.55 + 0.45 * Math.sin(m.ph));
        g.fillStyle = m.col;
        g.beginPath(); g.arc(m.x, m.y, m.r, 0, Math.PI * 2); g.fill();
      }
      g.globalAlpha = 1;
      for (var i = parts.length - 1; i >= 0; i--) {
        var p = parts[i];
        p.vy += p.grav * dt;
        p.vx *= 0.994; p.vy *= 0.994;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rot += p.vr * dt;
        p.life -= dt;
        if (p.life <= 0 || p.y > H + 60 || p.x < -80 || p.x > W + 80) { parts.splice(i, 1); continue; }
        g.globalAlpha = Math.min(1, p.life / (p.kind === 'spark' ? 1.2 : 0.8));
        g.save();
        g.translate(p.x, p.y); g.rotate(p.rot);
        g.fillStyle = p.color;
        if (p.kind === 'spark') {
          g.shadowBlur = 8; g.shadowColor = p.color;
          g.beginPath(); g.arc(0, 0, p.size, 0, Math.PI * 2); g.fill();
        } else {
          g.fillRect(-p.size * 0.5, -p.size * 1.7, p.size, p.size * 3.4);
        }
        g.restore();
      }
      g.globalAlpha = 1;
      raf = requestAnimationFrame(frame);
    }
    function shards(n) {
      n = n || 90;
      for (var i = 0; i < n; i++) {
        add({
          kind: 'shard',
          x: Math.random() * W, y: -20 - Math.random() * H * 0.6,
          vx: (Math.random() - 0.5) * 90, vy: 90 + Math.random() * 200,
          grav: 40, size: 2 + Math.random() * 2.6,
          rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 12,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          life: 3.4 + Math.random() * 2
        });
      }
    }
    function burst(x, y, n, spread) {
      n = n || 60; spread = spread || 1;
      for (var i = 0; i < n; i++) {
        var a = Math.random() * Math.PI * 2, sp = (100 + Math.random() * 300) * spread;
        add({
          kind: 'spark', x: x, y: y,
          vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          grav: 90, size: 1.2 + Math.random() * 2.2, rot: 0, vr: 0,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          life: 0.6 + Math.random() * 0.9
        });
      }
    }
    function fireworks(times) {
      times = times || 5;
      for (var i = 0; i < times; i++) {
        (function (k) {
          setTimeout(function () {
            burst(W * (0.18 + Math.random() * 0.64), H * (0.14 + Math.random() * 0.4), 54, 1);
            Snd.blip(0.6 + Math.random() * 0.4);
          }, 340 * k);
        })(i);
      }
    }
    function party() { shards(120); fireworks(5); setTimeout(function () { shards(70); }, 900); }

    window.addEventListener('resize', resize);
    resize();
    if (!reduced) start();
    return { shards: shards, burst: burst, fireworks: fireworks, party: party, resize: resize,
             get w() { return W; }, get h() { return H; } };
  })();

  /* ==================== 屏幕 ==================== */
  var curScreen = 'bootScreen';
  function show(id) {
    var list = document.querySelectorAll('.screen');
    for (var i = 0; i < list.length; i++) list[i].classList.toggle('active', list[i].id === id);
    curScreen = id;
    var bl = $('#hudBL');
    if (bl) {
      if (id === 'bootScreen') bl.textContent = 'SYS // STANDBY';
      else if (id === 'chargeScreen') bl.textContent = 'SYS // CHARGING';
      else bl.textContent = 'SYS // WELCOME, ' + CONFIG.name;
    }
    window.scrollTo(0, 0);
  }

  /* ==================== ① 启动终端 ==================== */
  var BOOT = [
    'BIRTHDAY PROTOCOL v2.0 ................ LOADED',
    'SCANNING TARGET ....................... OK',
    'TARGET IDENTIFIED: ' + CONFIG.name,
    'AGE DETECTED: ' + CONFIG.age + '  |  STATUS: ONLINE',
    'AWAITING AUTHORIZATION ...'
  ];
  var bootTimers = [], bootReady = false, bootTyping = false;
  function clearBoot() { bootTimers.forEach(function (t) { clearTimeout(t); clearInterval(t); }); bootTimers = []; }
  function renderAllBoot() {
    clearBoot();
    $('#bootLines').innerHTML = BOOT.map(function (l) {
      return '<div class="line"><span class="prompt">&gt;</span> ' + esc(l) + '</div>';
    }).join('');
    revealStart();
  }
  function revealStart() {
    if (bootReady) return;
    bootReady = true; bootTyping = false;
    $('#startBtn').classList.add('show');
    $('#bootTip').textContent = '按空格 / 回车也可以';
  }
  function typeBoot() {
    bootTyping = true;
    var box = $('#bootLines'); box.innerHTML = '';
    var i = 0;
    function nextLine() {
      if (i >= BOOT.length) { bootTyping = false; revealStart(); return; }
      var div = document.createElement('div');
      div.className = 'line';
      box.appendChild(div);
      var txt = BOOT[i], j = 0;
      var timer = setInterval(function () {
        j++;
        div.innerHTML = '<span class="prompt">&gt;</span> ' + esc(txt.slice(0, j)) + '<span class="caret"></span>';
        if (j >= txt.length) {
          clearInterval(timer);
          div.innerHTML = '<span class="prompt">&gt;</span> ' + esc(txt);
          i++;
          bootTimers.push(setTimeout(nextLine, 150));
        }
      }, 13);
      bootTimers.push(timer);
    }
    nextLine();
  }
  $('#bootScreen').addEventListener('click', function () {
    if (!bootReady && bootTyping) renderAllBoot();
  });
  $('#startBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    Snd.unlock(); Snd.confirm();
    FX.burst(window.innerWidth * 0.5, window.innerHeight * 0.5, 40, 0.8);
    show('chargeScreen');
  });

  /* ==================== ② 蓄能 ==================== */
  var CHARGE_MS = 3200, TICKS = CONFIG.age;
  var wrap = $('#reactorWrap'), core = $('#core'), coreNum = $('#coreNum');
  var ringProg = $('#ringProg'), chargeBar = $('#chargeBar'), ticksEls = [];
  var CIRC = 2 * Math.PI * 118;
  var charging = false, locked = false, progress = 0, chargeStart = 0, lastLit = -1, rafId = null;

  (function buildReactor() {
    var box = $('#ticks');
    for (var i = 0; i < TICKS; i++) {
      var t = document.createElement('i');
      t.className = 'tick';
      t.style.transform = 'rotate(' + (i * (360 / TICKS)) + 'deg) translateY(-118px)';
      box.appendChild(t);
      ticksEls.push(t);
    }
    ringProg.setAttribute('stroke-dasharray', CIRC.toFixed(2));
    ringProg.setAttribute('stroke-dashoffset', CIRC.toFixed(2));
  })();

  function render(p) {
    wrap.style.setProperty('--p', p.toFixed(3));
    ringProg.setAttribute('stroke-dashoffset', (CIRC * (1 - p)).toFixed(2));
    chargeBar.style.width = (p * 100).toFixed(1) + '%';
    var lit = Math.floor(p * TICKS + 0.0001);
    if (lit !== lastLit) {
      for (var i = 0; i < TICKS; i++) ticksEls[i].classList.toggle('on', i < lit);
      coreNum.textContent = lit;
      if (lit > lastLit && lit > 0) Snd.blip(lit / TICKS);
      lastLit = lit;
    }
  }
  function chargeLoop(now) {
    if (!charging) return;
    progress = Math.min(1, (now - chargeStart) / CHARGE_MS);
    render(progress);
    Snd.riserSet(progress);
    if (progress >= 1) { complete(); return; }
    rafId = requestAnimationFrame(chargeLoop);
  }
  function decayLoop() {
    if (charging) return;
    if (progress <= 0) { progress = 0; render(0); rafId = null; return; }
    progress = Math.max(0, progress - 0.03);
    render(progress);
    rafId = requestAnimationFrame(decayLoop);
  }
  function startCharge() {
    if (locked || charging) return;
    charging = true;
    Snd.unlock(); Snd.riserStart();
    wrap.classList.add('charging');
    chargeStart = performance.now() - progress * CHARGE_MS;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(chargeLoop);
  }
  function endCharge() {
    if (!charging || locked) return;
    charging = false;
    wrap.classList.remove('charging');
    Snd.riserStop(false);
    if (progress > 0.05 && progress < 1) Snd.blip(0.15);
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(decayLoop);
  }
  function complete() {
    locked = true; charging = false;
    if (rafId) cancelAnimationFrame(rafId);
    Snd.riserStop(true);
    render(1);
    wrap.classList.remove('charging');
    wrap.classList.add('done');
    $('#chargeHint').textContent = 'LEVEL ' + CONFIG.age + ' · UNLOCKED';
    var r = core.getBoundingClientRect();
    FX.burst(r.left + r.width / 2, r.top + r.height / 2, 130, 1.6);
    var f = $('#flash');
    f.classList.add('on');
    document.body.classList.add('shake');
    setTimeout(function () { f.classList.remove('on'); }, 60);
    setTimeout(function () { document.body.classList.remove('shake'); }, 460);
    Snd.confirm();
    setTimeout(function () { FX.party(); }, 320);
    setTimeout(startWish, 950);
  }
  function resetCharge() {
    locked = false; charging = false; progress = 0; lastLit = -1;
    if (rafId) cancelAnimationFrame(rafId);
    wrap.classList.remove('done', 'charging');
    $('#chargeHint').textContent = '长按核心开始蓄能 · 松开会中断';
    render(0);
  }

  wrap.addEventListener('pointerdown', function (e) {
    if (locked) return;
    e.preventDefault();
    try { wrap.setPointerCapture(e.pointerId); } catch (err) {}
    startCharge();
  });
  wrap.addEventListener('pointerup', endCharge);
  wrap.addEventListener('pointercancel', endCharge);
  wrap.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      var tag0 = (e.target && e.target.tagName) || '';
      if (curScreen === 'wishScreen' && tag0 !== 'INPUT') { e.preventDefault(); cardStep(e.key === 'ArrowRight' ? 1 : -1); }
      return;
    }
    if (e.key !== ' ' && e.key !== 'Enter') return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (curScreen === 'bootScreen') {
      if (!bootReady && bootTyping) { e.preventDefault(); renderAllBoot(); }
      return;
    }
    if (curScreen === 'chargeScreen') { e.preventDefault(); startCharge(); return; }
    if (curScreen === 'wishScreen') { e.preventDefault(); replay(); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === ' ' || e.key === 'Enter') endCharge();
  });

  /* ==================== ③ 祝福卡片 ==================== */
  var typeTimer = null, pageIdx = 0, cardPages = [];
  var cardEl = $('#card'), cardBody = $('#cardBody'), cardTitle = $('#cardTitle');
  var cardText = $('#cardText'), cardCode = $('#cardCode'), cardDots = $('#cardDots');
  var cardPrev = $('#cardPrev'), cardNext = $('#cardNext');

  function days() {
    if (CONFIG.birthDate) {
      var b = new Date(CONFIG.birthDate + 'T00:00:00');
      if (!isNaN(b.getTime())) return Math.max(0, Math.floor((Date.now() - b.getTime()) / 86400000));
    }
    return Math.round(CONFIG.age * 365.25);
  }

  function buildPages() {
    cardPages = [{
      code: '01 / BIRTHDAY',
      title: CONFIG.titleTemplate.replace('{name}', CONFIG.name),
      text: CONFIG.message.join('\n'),
      typed: true
    }];
    CONFIG.cards.forEach(function (c, i) {
      cardPages.push({
        code: '0' + (i + 2) + ' / ' + c.name,
        title: c.title,
        text: c.text
      });
    });
    cardDots.innerHTML = cardPages.map(function () { return '<i></i>'; }).join('');
  }

  function renderPage(i, animate) {
    if (!cardPages.length) return;
    pageIdx = (i + cardPages.length) % cardPages.length;
    var pg = cardPages[pageIdx];
    cardCode.textContent = pg.code;
    cardTitle.textContent = pg.title;
    var dots = cardDots.children;
    for (var k = 0; k < dots.length; k++) dots[k].classList.toggle('on', k === pageIdx);
    cardPrev.disabled = pageIdx === 0;
    cardNext.disabled = pageIdx === cardPages.length - 1;
    if (animate) {
      cardBody.classList.remove('swap');
      void cardBody.offsetWidth;
      cardBody.classList.add('swap');
    }
    if (typeTimer) { clearInterval(typeTimer); typeTimer = null; }
    if (pg.typed && !reduced) typeCard(pg.text); else cardText.textContent = pg.text;
    // 卡片高度可能变化，重新给弹幕分轨道，避免压到卡片
    setTimeout(dmCalcLanes, 60);
  }

  function typeCard(text) {
    var i = 0;
    cardText.innerHTML = '<span class="caret"></span>';
    typeTimer = setInterval(function () {
      i += 1;
      cardText.innerHTML = esc(text.slice(0, i)).replace(/\n/g, '<br>') + '<span class="caret"></span>';
      if (i >= text.length) { clearInterval(typeTimer); typeTimer = null; cardText.textContent = text; }
    }, 42);
  }

  function cardStep(dir) {
    var next = pageIdx + dir;
    if (next < 0 || next >= cardPages.length) { Snd.blip(0.2); return; }
    Snd.blip(0.4 + pageIdx * 0.12);
    renderPage(next, true);
    var r = cardEl.getBoundingClientRect();
    FX.burst(r.left + r.width * 0.5, r.bottom, 14, 0.4);
  }
  cardPrev.addEventListener('click', function () { cardStep(-1); });
  cardNext.addEventListener('click', function () { cardStep(1); });
  // 左右滑动翻页
  (function () {
    var x0 = null, y0 = null;
    cardEl.addEventListener('touchstart', function (e) {
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, { passive: true });
    cardEl.addEventListener('touchend', function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy)) cardStep(dx < 0 ? 1 : -1);
      x0 = null;
    }, { passive: true });
  })();

  function floatText(txt, x, y) {
    var s = document.createElement('span');
    s.className = 'float-txt';
    s.textContent = txt;
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    document.body.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 1400);
  }

  function startWish() {
    show('wishScreen');
    buildPages();
    renderPage(0, false);
    $('#cardSign').textContent = 'FOR YOU · ' + days().toLocaleString('en-US') + ' DAYS';
    cardEl.classList.remove('in');
    void cardEl.offsetWidth;
    cardEl.classList.add('in');
    setTimeout(function () { FX.party(); }, 200);
    Snd.setOn(true);
    setMusicBtn(true);
    setTimeout(dmCalcLanes, 1000);
    setTimeout(dmStart, 700);
  }

  /* ==================== 弹幕祝福 ==================== */
  /* 弹幕内容来自页面里的 #dmSource（一行一条：名字|内容） */
  var DMPool = (function () {
    var el = document.getElementById('dmSource'), out = [];
    if (el) {
      el.textContent.split('\n').forEach(function (line) {
        line = line.replace(/\r/g, '').trim();
        if (!line || line.charAt(0) === '#') return;
        var i = line.indexOf('|');
        var who = (i < 0 ? '朋友' : line.slice(0, i)).trim() || '朋友';
        var text = (i < 0 ? line : line.slice(i + 1)).trim();
        if (text) out.push({ who: who, text: text });
      });
    }
    if (!out.length) out = [{ who: '朋友', text: '生日快乐！' }];
    return out;
  })();
  var dmLayer = $('#dmLayer'), dmBar = $('#dmBar'), dmInput = $('#dmInput');
  var dmToggle = $('#dmToggle'), dmSendBtn = $('#dmSend');
  var dmOn = true, dmTimer = null, dmLanes = [];

  function dmCalcLanes() {
    var H = window.innerHeight, h = window.innerWidth < 420 ? 32 : 38;
    var top0 = 66, bot0 = H - (dmBar.classList.contains('show') ? 126 : 150);
    var gap = 16, bands = [];
    var rect = cardEl ? cardEl.getBoundingClientRect() : null;
    if (rect && rect.height > 60 && rect.top > top0 + 20 && rect.bottom < bot0) {
      // 卡片上方 + 下方两条空档，弹幕不会压到卡片文字
      if (rect.top - gap - top0 >= h * 0.8) bands.push([top0, rect.top - gap]);
      if (bot0 - (rect.bottom + gap) >= h * 0.8) bands.push([rect.bottom + gap, bot0]);
      if (!bands.length) bands.push([top0, bot0]);
    } else {
      bands.push([top0, bot0]);
    }
    var old = dmLanes, lanes = [];
    bands.forEach(function (b) {
      for (var y = b[0]; y <= b[1] - h * 0.55; y += h) lanes.push(y);
    });
    dmLanes = lanes.map(function (y, i) {
      return { y: y, freeAt: old[i] && old[i].y === y ? old[i].freeAt : 0 };
    });
  }
  function dmPickLane(now, force) {
    var best = null, i;
    for (i = 0; i < dmLanes.length; i++) {
      var L = dmLanes[i];
      if (L.freeAt <= now && (!best || L.freeAt < best.freeAt)) best = L;
    }
    if (!best) {
      if (!force) return null;
      for (i = 0; i < dmLanes.length; i++) if (!best || dmLanes[i].freeAt < best.freeAt) best = dmLanes[i];
    }
    return best;
  }
  function dmNew(item, force) {
    if (!dmLayer || dmLayer.children.length > 12) return false;
    var now = performance.now();
    var lane = dmPickLane(now, force);
    if (!lane) return false;

    var el = document.createElement('div');
    el.className = 'dm' + (item.me ? ' me' : '');
    el.innerHTML = '<span class="sender">[' + esc(item.who) + ']</span>' + esc(item.text);
    el.style.top = lane.y + 'px';
    el.style.visibility = 'hidden';
    dmLayer.appendChild(el);

    var w = el.offsetWidth || 140;
    el.style.visibility = '';
    var vw = dmLayer.clientWidth || window.innerWidth || 360;
    var speed = item.me ? 185 : (92 + Math.random() * 78);
    var dur = (vw + w) / speed;
    el.style.animationDuration = dur.toFixed(2) + 's';
    el.style.setProperty('--x1', -(vw + w) + 'px');
    el.classList.add('run');
    lane.freeAt = now + (w / speed) * 1000 + 320;

    var kill = function () { if (el.parentNode) el.parentNode.removeChild(el); };
    el.addEventListener('animationend', kill);
    setTimeout(kill, (dur + 1.2) * 1000);
    el.addEventListener('pointerdown', function (ev) {
      ev.stopPropagation();
      if (el.classList.contains('pop')) return;
      el.classList.add('pop');
      Snd.pop();
      var r = el.getBoundingClientRect();
      floatText('+1', r.left + r.width * 0.5, r.top);
      FX.burst(r.left + r.width * 0.5, r.top + r.height * 0.5, 14, 0.5);
      setTimeout(function () { el.classList.remove('pop'); }, 260);
    });
    return true;
  }
  function dmTick() {
    if (!dmOn || curScreen !== 'wishScreen') { dmTimer = null; return; }
    dmNew(DMPool[(Math.random() * DMPool.length) | 0], true);
    dmTimer = setTimeout(dmTick, 1100 + Math.random() * 1300);
  }
  function dmStart() {
    if (!dmOn) return;
    document.body.classList.add('dm-on');
    dmBar.classList.add('show');
    dmCalcLanes();
    if (dmTimer) return;
    for (var i = 0; i < 2; i++) {
      (function (k) {
        setTimeout(function () {
          if (dmOn && curScreen === 'wishScreen') dmNew(DMPool[(Math.random() * DMPool.length) | 0], true);
        }, k * 900);
      })(i);
    }
    dmTimer = setTimeout(dmTick, 1800);
  }
  function dmStop(hideBar) {
    if (dmTimer) { clearTimeout(dmTimer); dmTimer = null; }
    if (dmLayer) dmLayer.innerHTML = '';
    if (hideBar) {
      document.body.classList.remove('dm-on');
      dmBar.classList.remove('show');
    }
  }
  function dmSend() {
    var v = (dmInput.value || '').replace(/\s+/g, ' ').trim().slice(0, 36);
    if (!v) { dmInput.focus(); return; }
    if (!dmOn) {
      dmOn = true;
      dmToggle.textContent = '弹幕 ON';
      dmToggle.classList.remove('off');
      dmStart();
    }
    if (dmNew({ who: '你', text: v, me: true }, true)) {
      Snd.confirm();
      FX.shards(18);
    }
    dmInput.value = '';
    dmInput.focus();
  }
  dmSendBtn.addEventListener('click', dmSend);
  dmInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); dmSend(); }
  });
  dmToggle.addEventListener('click', function () {
    dmOn = !dmOn;
    dmToggle.textContent = dmOn ? '弹幕 ON' : '弹幕 OFF';
    dmToggle.classList.toggle('off', !dmOn);
    if (dmOn) { dmStart(); Snd.soft(); } else { dmStop(false); Snd.blip(0.2); }
  });

  function replay() {
    Snd.setOn(true);
    setMusicBtn(true);
    FX.party();
  }
  $('#replayBtn').addEventListener('click', replay);
  $('#againBtn').addEventListener('click', function () {
    Snd.stop();
    dmStop(true);
    resetCharge();
    show('chargeScreen');
    Snd.soft();
  });

  /* ==================== 音乐开关 ==================== */
  var musicBtn = $('#musicBtn');
  function setMusicBtn(on) {
    musicBtn.classList.toggle('on', on);
    musicBtn.textContent = on ? '\u266A' : '\u2715';
  }
  setMusicBtn(true);
  musicBtn.addEventListener('click', function () {
    var on = !Snd.isOn();
    Snd.setOn(on);
    setMusicBtn(on);
    if (on) Snd.soft();
  });

  /* ==================== 初始化 ==================== */
  $('#chargeTitle').textContent = '为 ' + CONFIG.age + ' 岁蓄能';
  render(0);
  if (reduced) renderAllBoot(); else typeBoot();
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { if (Snd.isOn()) Snd.stop(); }
    else if (Snd.isOn() && curScreen === 'wishScreen') Snd.play();
  });
  window.addEventListener('resize', function () { dmCalcLanes(); });
})();
</script>
</body>
</html>
